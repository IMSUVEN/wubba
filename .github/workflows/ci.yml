name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --extra examples

      - name: Ruff
        run: uv run ruff check src examples tests

      - name: Pytest
        run: uv run pytest tests

      - name: Pyright
        run: uv run pyright

      - name: Import version
        run: uv run python -c "import wubba; print(wubba.__version__)"
